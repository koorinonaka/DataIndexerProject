{% extends "main.html" %}

{#-
  トップ (AB 統合案): A 案の構成 (エディタの実画面が主役) + B 案の配色 + IBM Plex。
  en / ja は同じ構成で、文言だけを is_ja で切り替える。
  動画: mkdocs.yml の extra.hero_video に mp4 のパスを書くと <video> に替わる。空なら poster 画像だけを出す。
-#}

{% block extrahead %}{{ super() }}
<link rel="stylesheet" href="{{ 'assets/stylesheets/home.css' | url }}">
{% endblock %}

{% block container %}
{% set is_ja = config.theme.language == 'ja' %}
{% set img = base_url ~ '/assets/images/' %}
<div class="md-content di-home" data-md-component="content">

  <section class="di-hero">
    <div class="di-home__inner">
      {% if is_ja %}
      <h1>リネームしても、参照は壊れない。</h1>
      <p class="di-lead">DataIndexer は UE5 のためのゲームデータ管理プラグイン。すべての行は GUID（<code>FDataIndexerPrimaryKey</code>）で識別されるため、リネームしても既存の参照はすべて有効のまま。型安全な C++ / Blueprint API と Schema による一元管理が、データ規模が拡大しても保守コストを抑えます。</p>
      {% else %}
      <h1>Rename rows. References hold.</h1>
      <p class="di-lead">DataIndexer is a game data management plugin for UE5. Every row is identified by a GUID (<code>FDataIndexerPrimaryKey</code>), so references survive renames, moves, and reimports. A type-safe C++ / Blueprint API and a centralized Schema keep maintenance costs low as your data grows.</p>
      {% endif %}

      <div class="di-hero__media">
        {% if config.extra.hero_video %}
        <video autoplay muted loop playsinline poster="{{ img }}editor-overview.png" aria-label="DataIndexer editor with the Data View and Details panels open">
          <source src="{{ base_url }}/{{ config.extra.hero_video }}" type="video/mp4">
        </video>
        {% else %}
        <img src="{{ img }}editor-overview.png" alt="DataIndexer editor with the Data View and Details panels open">
        {% endif %}
      </div>

      <ol class="di-points">
        {% if is_ja %}
        <li><a href="concepts/keys-and-handles/">GUID ベースの PrimaryKey</a><span>キー名を変更しても参照はそのまま維持。Blueprint やコードの参照が壊れません。</span></li>
        <li><a href="editor-guide/data-view/">Key 参照の追跡</a><span>Key がどのアセット・コードから参照されているかをエディタ上で確認できます。</span></li>
        <li><a href="how-to/parent-hierarchy/">継承時の上書き</a><span>子 Repository 内で特定の Row だけを上書き。UCompositeDataTable にはなかった機能で、変更箇所が明確に追えます。</span></li>
        <li><a href="concepts/indexes/">セカンダリクエリ</a><span>Blueprint・C++ どちらからも、定義したインデックス経由で O(1) に近い効率で Row を検索。行数が増えても性能が劣化しません。</span></li>
        {% else %}
        <li><a href="concepts/keys-and-handles/">GUID-based PrimaryKey</a><span>Change a key's name freely — Blueprint and code references stay intact.</span></li>
        <li><a href="editor-guide/data-view/">Key usage tracking</a><span>See which assets and code reference a given row, directly in the editor.</span></li>
        <li><a href="how-to/parent-hierarchy/">Per-row overrides</a><span>Override only specific rows in a child repository — a capability UCompositeDataTable didn't have.</span></li>
        <li><a href="concepts/indexes/">Secondary queries</a><span>Look up rows by an index from Blueprint or C++ at near-O(1) efficiency.</span></li>
        {% endif %}
      </ol>
    </div>
  </section>

  <section class="di-keymap" aria-label="{{ 'GUID キーと参照' if is_ja else 'GUID keys and references' }}">
    <div class="di-home__inner di-keymap__body">
      <div>
        <span class="di-keymap__label">{{ '参照元' if is_ja else 'Referenced by' }}</span>
        <ul class="di-keymap__refs">
          <li><small>Blueprint</small>Get Row</li>
          <li><small>C++</small>FindRow(Repository, PrimaryKey)</li>
          <li><small>UPROPERTY</small>FDataIndexerPrimaryKey</li>
        </ul>
      </div>
      <svg class="di-keymap__arrow" width="28" height="16" viewBox="0 0 28 16" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M2 8h22m-6-6 6 6-6 6"/></svg>
      <div>
        <div class="di-keymap__row">
          <div class="di-keymap__head"><span>PrimaryKey</span><span>RowName</span></div>
          <code class="di-keymap__key">A1B2C3D4-E5F6-7890-ABCD-EF1234567890</code>
          <span class="di-keymap__name"><del>IronSword</del><svg width="20" height="12" viewBox="0 0 28 16" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M2 8h22m-6-6 6 6-6 6"/></svg><ins>Iron_Sword</ins></span>
        </div>
        {% if is_ja %}
        <p class="di-keymap__note">キーは行を作ったときに一度だけ生成され、変わらない。表示名を変えても参照には影響しない。</p>
        {% else %}
        <p class="di-keymap__note">The key is generated once when a row is created and never changes. Renaming the row doesn't affect references.</p>
        {% endif %}
      </div>
    </div>
  </section>

  <section class="di-section">
    <div class="di-home__inner">
      <div class="di-section__head">
        {% if is_ja %}
        <h2>スプレッドシート感覚の編集から、型安全な管理まで。</h2>
        <a href="editor-guide/">エディタガイド →</a>
        {% else %}
        <h2>Spreadsheet-feel editing to type-safe management.</h2>
        <a href="editor-guide/">Editor Guide →</a>
        {% endif %}
      </div>
      <div class="di-tiles">
        <a class="di-tile" href="editor-guide/data-view/">
          <img src="{{ img }}cellop.gif" alt="Cell selection and inline editing in the Data View" style="object-position: 0 50%;" loading="lazy">
          <div class="di-tile__text">
            <span class="di-tile__path">editor-guide/data-view</span>
            {% if is_ja %}
            <span class="di-tile__title">編集はセルで。整合性はスキーマで。</span>
            <span class="di-tile__desc">セル単位の選択、Shift / Ctrl による拡張選択、矩形範囲のドラッグ、ダブルクリックでインライン編集。</span>
            {% else %}
            <span class="di-tile__title">Edit in cells. Schema enforces integrity.</span>
            <span class="di-tile__desc">Per-cell selection, Shift / Ctrl range extension, rectangular drag selection, and double-click inline editing.</span>
            {% endif %}
          </div>
        </a>
        <a class="di-tile" href="concepts/keys-and-handles/">
          <img src="{{ img }}data-view-reference-viewer.gif" alt="Reference Viewer opened from a row in the Data View" style="object-position: 0 0;" loading="lazy">
          <div class="di-tile__text">
            <span class="di-tile__path">concepts/keys-and-handles</span>
            {% if is_ja %}
            <span class="di-tile__title">リネームしても、参照は壊れない。</span>
            <span class="di-tile__desc">エディタ上で Key 参照を可視化。アセット・コード横断で追跡でき、安心してリファクタリングできる設計。</span>
            {% else %}
            <span class="di-tile__title">Renames don't break references.</span>
            <span class="di-tile__desc">Key usage visualized in the editor. Track across assets and code.</span>
            {% endif %}
          </div>
        </a>
        <a class="di-tile" href="how-to/parent-hierarchy/">
          <img src="{{ img }}feature-03.png" alt="Repository with Parent Repositories in Asset Details" style="object-position: 0 50%;" loading="lazy">
          <div class="di-tile__text">
            <span class="di-tile__path">how-to/parent-hierarchy</span>
            {% if is_ja %}
            <span class="di-tile__title">継承と統合で、データを重ねる。</span>
            <span class="di-tile__desc">親 Repository の合成で実現。子 Repository から特定の Row だけを上書きでき、変更箇所が明確に追える。</span>
            {% else %}
            <span class="di-tile__title">Layer data with inheritance.</span>
            <span class="di-tile__desc">Repository inheritance. Override individual rows with change tracking.</span>
            {% endif %}
          </div>
        </a>
        <a class="di-tile" href="concepts/indexes/">
          <img src="{{ img }}feature-04.png" alt="Blueprint nodes Get Rows Keys and Make Item Row querying by rarity" style="object-position: 50% 50%;" loading="lazy">
          <div class="di-tile__text">
            <span class="di-tile__path">concepts/indexes</span>
            {% if is_ja %}
            <span class="di-tile__title">属性による、高速な逆引き。</span>
            <span class="di-tile__desc">スキーマで定義した Index 経由で O(1) 近似の高速検索。</span>
            {% else %}
            <span class="di-tile__title">Fast lookup by any attribute.</span>
            <span class="di-tile__desc">Near-O(1) lookup via Schema-defined Index.</span>
            {% endif %}
          </div>
        </a>
      </div>
    </div>
  </section>

  <section class="di-section di-section--last">
    <div class="di-home__inner">
      <div class="di-section__head">
        {% if is_ja %}
        <h2>C++ でも Blueprint でも、同じデータに同じ整合性で。</h2>
        <a href="api-reference/">API リファレンス →</a>
        {% else %}
        <h2>The same data. C++ or Blueprint.</h2>
        <a href="api-reference/">API Reference →</a>
        {% endif %}
      </div>
      <div class="di-practice">

        <div class="di-codebox">
          <div class="di-codebox__head" role="tablist">
            <button type="button" role="tab" class="di-codetab" id="di-tab-cpp" aria-controls="di-pane-cpp" aria-selected="true" data-tab="cpp">C++</button>
            <button type="button" role="tab" class="di-codetab" id="di-tab-bp" aria-controls="di-pane-bp" aria-selected="false" tabindex="-1" data-tab="bp">Blueprint</button>
            <button type="button" class="di-codebox__copy" data-copy="di-code-cpp" aria-label="Copy code">
              <svg width="13" height="13" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><rect x="5" y="5" width="9" height="9" rx="1.5"></rect><path d="M11 5V3.5A1.5 1.5 0 0 0 9.5 2h-6A1.5 1.5 0 0 0 2 3.5v6A1.5 1.5 0 0 0 3.5 11H5"></path></svg>
              <span>copy</span>
            </button>
          </div>
          <div class="di-codepane" id="di-pane-cpp" role="tabpanel" aria-labelledby="di-tab-cpp" data-pane="cpp">
<pre><code id="di-code-cpp"><span class="m">USTRUCT</span>(BlueprintType)
<span class="k">struct</span> <span class="t">FItemRow</span>
{
    <span class="m">GENERATED_BODY</span>()

    <span class="m">UPROPERTY</span>(EditAnywhere, BlueprintReadWrite) <span class="t">FText</span>       DisplayName;
    <span class="m">UPROPERTY</span>(EditAnywhere, BlueprintReadWrite) <span class="t">EItemType</span>   Type;
    <span class="m">UPROPERTY</span>(EditAnywhere, BlueprintReadWrite) <span class="t">EItemRarity</span> Rarity;
    <span class="m">UPROPERTY</span>(EditAnywhere, BlueprintReadWrite) <span class="t">int32</span>       BaseValue = 0;
};
<span class="k">using</span> <span class="t">FItemInterface</span> = DataIndexer::<span class="t">TNativeSchemaInterface</span>&lt;<span class="t">FItemRow</span>&gt;;

<span class="k">if</span> (<span class="k">const</span> <span class="t">FItemRow</span>* Row = FItemInterface::FindRow(Repository, PrimaryKey))
{
    <span class="t">FText</span> Name = Row-&gt;DisplayName;
}

<span class="t">FItemRow</span> Filter; Filter.Rarity = EItemRarity::Rare;
<span class="k">for</span> (<span class="k">const</span> <span class="t">FDataIndexerPrimaryKey</span>&amp; K :
     FItemInterface::GetPrimaryKeys(
         Repository, UItemSchema::ByRarityIndex(), Filter))
{
    Process(*FItemInterface::FindRow(Repository, K));
}</code></pre>
          </div>
          <div class="di-codepane" id="di-pane-bp" role="tabpanel" aria-labelledby="di-tab-bp" data-pane="bp" hidden>
            <figure class="di-codebox__figure">
              <img src="{{ img }}bp-struct-sample.png" alt="Blueprint struct setup" loading="lazy">
              <figcaption>{% if is_ja %}エディタで構造体を定義{% else %}Define the struct — build types in the editor{% endif %}</figcaption>
            </figure>
          </div>
        </div>

        <div class="di-practice__side">
          <figure class="di-figure">
            <img src="{{ img }}bp-node-sample.png" alt="Blueprint graph: Get Rows Keys, For Each Loop, Get Row and Break Character Row nodes" loading="lazy">
            <figcaption>{% if is_ja %}Get Row / Get Primary Keys ノードでクエリ{% else %}Query with nodes — Get Row / Get Primary Keys{% endif %}</figcaption>
          </figure>
          <dl class="di-facts">
            {% if is_ja %}
            <div><dt>型はスキーマで一元管理</dt><dd>C++ は <code>TNativeSchemaInterface&lt;T&gt;</code> で型安全なクエリ。Blueprint は Get Row ノードで同じ行データを視覚的に扱えます。</dd></div>
            <div><dt>保存・Cook 時に自動検証</dt><dd>Row 間のリレーションと参照整合性をスキーマが自動チェック。データ不整合をランタイム前に検出します。</dd></div>
            <div><dt>O(1) 近似の逆引き</dt><dd>スキーマで Index を宣言すれば、属性ベースの検索が高速に。行数が増えても性能劣化なし。</dd></div>
            {% else %}
            <div><dt>Types in one place</dt><dd>C++ queries are type-safe via <code>TNativeSchemaInterface&lt;T&gt;</code>. Blueprint uses Get Row nodes for the same data.</dd></div>
            <div><dt>Auto-validated on save and cook</dt><dd>Row-to-row relations and referential integrity checked automatically. Catch data inconsistencies before runtime.</dd></div>
            <div><dt>Near-O(1) reverse lookup</dt><dd>Declare an Index on the schema. Attribute-based search stays fast as row count grows.</dd></div>
            {% endif %}
          </dl>
          {% if is_ja %}
          <p class="di-migrate">既存の DataTable プロジェクトからは <a href="how-to/migrate-from-datatable/">「DataTable から移行する」</a> ガイドで段階的に移行できます。</p>
          {% else %}
          <p class="di-migrate">Existing DataTable projects can migrate incrementally — see the <a href="how-to/migrate-from-datatable/">Migrate from DataTable</a> guide.</p>
          {% endif %}
        </div>
      </div>
    </div>
  </section>

</div>
{% endblock %}
